name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  typecheck-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MOCK_LLM: "1"
      AGENT_SHARED_SECRET: dev_secret_lungmat_ci
      NODE_ENV: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck:ci

      - name: E2E (mock)
        run: npm run test:e2e:ci

  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t lungmat-agent:ci .
